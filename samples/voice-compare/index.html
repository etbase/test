<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美式語音試聽</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #071b30; color: #e8f4f8; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.6rem; }
  p { line-height: 1.6; color: #b7d0dc; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #1d3e5c; vertical-align: middle; }
  audio { width: 100%; }
</style>
</head>
<body>
<main>
  <h1>同一句，兩種免費美式語音</h1>
  <p>Piper 是 en_US-lessac-high。Kokoro 是 af_heart。兩邊唸的字完全一樣。</p>
  <table>
    <thead><tr><th>內容</th><th>Piper</th><th>Kokoro</th></tr></thead>
    <tbody>
      <tr>
        <td>think</td>
        <td><audio controls preload="none" src="piper-think.mp3"></audio></td>
        <td><audio controls preload="none" src="kokoro-think.mp3"></audio></td>
      </tr>
      <tr>
        <td>Thank you for waiting.</td>
        <td><audio controls preload="none" src="piper-sentence.mp3"></audio></td>
        <td><audio controls preload="none" src="kokoro-sentence.mp3"></audio></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
